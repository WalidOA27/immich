# Throwaway Immich to try the NSFW fork (also used by e2e.sh). Data lives in NAMED volumes, so it works with a remote
# docker daemon; reset with `docker compose -p <project> -f misc/nsfw/docker-compose.test.yml down -v`.
# Usage:  docker compose -p immich-nsfw-test -f misc/nsfw/docker-compose.test.yml up -d   → http://localhost:2284
# Env: NSFW_IMAGE, ML_IMAGE_TAG, IMMICH_NSFW_THRESHOLD, NSFW_TEST_BIND (default 127.0.0.1), NSFW_TEST_PORT (default 2284)
name: immich-nsfw-test

services:
  server:
    image: ${NSFW_IMAGE:-immich-server:nsfw-v3.3.6}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    volumes:
      - library:/data
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_URL: http://machine-learning:3003
      IMMICH_NSFW_THRESHOLD: ${IMMICH_NSFW_THRESHOLD:-0.5}
    ports:
      - '${NSFW_TEST_BIND:-127.0.0.1}:${NSFW_TEST_PORT:-2284}:2283'
    depends_on:
      - redis
      - database

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${ML_IMAGE_TAG:-v3.3.6}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2g
    volumes:
      - model-cache:/cache

  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb

volumes:
  model-cache:
    # external so e2e.sh's `down -v` keeps the models; e2e.sh creates it. Manual use: docker volume create immich-nsfw-e2e-model-cache
    external: true
    name: immich-nsfw-e2e-model-cache
  library:
  pgdata:
